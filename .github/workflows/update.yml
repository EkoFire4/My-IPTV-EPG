
name: Automatic EPG Update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-epg:
    if: github.ref == 'refs/heads/development-v3.3'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax and baseline
        run: |
          python -m py_compile epg_engine_v32.py
          python -m py_compile epg_engine_v33.py
          python -m py_compile epg_engine_v34.py
          python -m py_compile epg_engine_v35.py
          python -m py_compile update_epg.py
          test -f v35-baseline.json

      - name: Run V3.6 development engine
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
        run: python update_epg.py

      - name: Upload V3.6 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EPG-V36-Diagnostics
          path: reports/v36-*
          retention-days: 3
          if-no-files-found: warn
