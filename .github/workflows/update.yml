
name: Automatic EPG Update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-epg:
    if: github.ref == 'refs/heads/development-v3.3'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run development EPG engine
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
        run: python update_epg.py

      - name: Upload EPG diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EPG-V33-Diagnostics
          path: reports/
          retention-days: 7
          if-no-files-found: warn
