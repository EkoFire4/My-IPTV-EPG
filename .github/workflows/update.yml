
name: Automatic EPG Update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-epg:
    if: github.ref == 'refs/heads/development-v3.3'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate files
        run: |
          python -m py_compile epg_engine_v32.py epg_engine_v33.py epg_engine_v34.py epg_engine_v35.py epg_engine_v36.py update_epg.py
          test -f v36-baseline.json
          test -f v37-reviewed-candidates.json

      - name: Run V3.7
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
        run: python update_epg.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EPG-V37-Diagnostics
          path: reports/v37-*
          retention-days: 3
          if-no-files-found: warn
