
name: Automatic EPG Update

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-update
  cancel-in-progress: false

jobs:
  update-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate EPG
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
        run: python update_epg.py

      - name: Save updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epgs/light-epg.xml.gz
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automatic EPG update"
            git push
          fi
